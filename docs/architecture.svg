<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#fafafa"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">WikiPulse — Real-Time Streaming Pipeline Architecture</text>

  <!-- Source -->
  <rect x="30" y="80" width="200" height="110" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Wikimedia</text>
  <text x="130" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">EventStreams</text>
  <text x="130" y="152" text-anchor="middle" font-size="11" fill="#37474f">SSE: /v2/stream/recentchange</text>
  <text x="130" y="170" text-anchor="middle" font-size="11" fill="#37474f">~1,000 events/min, all wikis</text>

  <!-- Ingest -->
  <rect x="300" y="80" width="190" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="395" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Ingestion Layer</text>
  <text x="395" y="130" text-anchor="middle" font-size="12" fill="#37474f">src/ingest.py</text>
  <text x="395" y="150" text-anchor="middle" font-size="11" fill="#37474f">parse + validate JSON</text>
  <text x="395" y="167" text-anchor="middle" font-size="11" fill="#37474f">reconnect w/ backoff</text>

  <!-- Queue -->
  <rect x="560" y="80" width="190" height="110" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="655" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Messaging Layer</text>
  <text x="655" y="130" text-anchor="middle" font-size="12" fill="#37474f">SQLite-backed queue</text>
  <text x="655" y="150" text-anchor="middle" font-size="11" fill="#37474f">src/queue_store.py (WAL)</text>
  <text x="655" y="167" text-anchor="middle" font-size="11" fill="#37474f">put / get_batch / ack</text>

  <!-- Processor -->
  <rect x="560" y="270" width="190" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="655" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Stream Processor</text>
  <text x="655" y="318" text-anchor="middle" font-size="12" fill="#37474f">src/processor.py</text>
  <text x="655" y="338" text-anchor="middle" font-size="11" fill="#37474f">clean + standardize schema</text>
  <text x="655" y="355" text-anchor="middle" font-size="11" fill="#37474f">enrich (dt, byte_change, is_bot)</text>
  <text x="655" y="372" text-anchor="middle" font-size="11" fill="#37474f">batch insert, 200/round-trip</text>

  <!-- MongoDB -->
  <rect x="300" y="270" width="190" height="120" rx="10" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="395" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#311b92">Storage Layer</text>
  <text x="395" y="318" text-anchor="middle" font-size="12" fill="#37474f">MongoDB — wikipulse.events</text>
  <text x="395" y="338" text-anchor="middle" font-size="11" fill="#37474f">1 document per event</text>
  <text x="395" y="355" text-anchor="middle" font-size="11" fill="#37474f">unique event_id absorbs dupes</text>
  <text x="395" y="372" text-anchor="middle" font-size="11" fill="#37474f">5 query-pattern indexes</text>

  <!-- Analytics -->
  <rect x="30" y="270" width="200" height="120" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="130" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#880e4f">Analytics Layer</text>
  <text x="130" y="318" text-anchor="middle" font-size="12" fill="#37474f">queries/aggregations.py</text>
  <text x="130" y="338" text-anchor="middle" font-size="11" fill="#37474f">trending pages · active users</text>
  <text x="130" y="355" text-anchor="middle" font-size="11" fill="#37474f">bot vs human · edits/minute</text>
  <text x="130" y="372" text-anchor="middle" font-size="11" fill="#37474f">sliding time window (--minutes)</text>

  <!-- Arrows -->
  <line x1="230" y1="135" x2="296" y2="135" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="263" y="125" text-anchor="middle" font-size="10" fill="#546e7a">raw JSON</text>

  <line x1="490" y1="135" x2="556" y2="135" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="523" y="125" text-anchor="middle" font-size="10" fill="#546e7a">publish</text>

  <line x1="655" y1="190" x2="655" y2="266" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="232" text-anchor="middle" font-size="10" fill="#546e7a">consume + ack</text>

  <line x1="560" y1="330" x2="494" y2="330" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="527" y="320" text-anchor="middle" font-size="10" fill="#546e7a">insert_many</text>

  <line x1="300" y1="330" x2="234" y2="330" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="267" y="320" text-anchor="middle" font-size="10" fill="#546e7a">aggregate</text>

  <!-- Guarantees note -->
  <rect x="30" y="440" width="920" height="90" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="50" y="468" font-size="13" font-weight="bold" fill="#263238">Delivery guarantees</text>
  <text x="50" y="490" font-size="12" fill="#37474f">Queue messages are deleted only after ack → at-least-once delivery between ingest and processor; either side can crash and restart without data loss.</text>
  <text x="50" y="510" font-size="12" fill="#37474f">The unique event_id index in MongoDB rejects redelivered/duplicate events (error 11000 counted as "absorbed") → effectively exactly-once end to end.</text>
</svg>
